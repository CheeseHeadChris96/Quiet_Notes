<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'"><title>Quiet Notes</title><link rel="stylesheet" href="style.css?v=0.22.0"></head>
<body>

<input id="text-file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden><input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="tab-bar"><strong class="tab-app-name">Quiet Notes</strong><button id="toggle-recents" aria-label="Hide recent notes sidebar" aria-controls="recents-sidebar" aria-expanded="true" title="Show or hide recents">◧</button><div id="note-tabs" role="tablist" aria-label="Open notes"></div><button id="new-note" aria-label="New note" title="New note (Ctrl / Command N)">+</button><span id="save-indicator" role="status" tabindex="0" data-state="saved"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path class="saved-mark" d="m7.5 12 3 3 6-6"/></svg><span id="save-status" class="visually-hidden">Saved</span><span id="save-tooltip" role="tooltip" aria-hidden="true">Saved</span></span></div>
<div class="workspace"><aside id="recents-sidebar" aria-label="Recent notes"><div class="recents-heading"><h2>Recents</h2><button id="hide-recents" aria-label="Hide recents" title="Hide recents">‹</button></div><div id="recent-notes"></div></aside><div class="document-area">
<main id="notes-home" role="tabpanel" aria-label="Notes list">
<header><h1 id="heading">All notes</h1></header>
<label class="search"><input id="search" type="search" aria-label="Search notes" placeholder="Search notes"><kbd>⌘ / Ctrl K</kbd></label>
<div class="collection-bar"><nav aria-label="Notes views"><button class="nav active" data-view="all">All <span id="all-count">0</span></button><button class="nav" data-view="pinned">Pinned <span id="pinned-count">0</span></button><button class="nav" data-view="trash">Trash <span id="trash-count">0</span></button></nav><select id="sort" aria-label="Sort notes"><option value="updated">Last edited</option><option value="created">Date created</option><option value="title">Title</option></select></div>
<section id="notes" aria-label="Notes"></section><div id="empty" hidden><h2>No notes yet</h2><p>Create a note to get started.</p><button id="empty-new" hidden>New note</button></div>
<div class="list-status"><span id="results">0 notes</span><span>Stored on this device</span></div>
</main>
<dialog id="editor" role="tabpanel" aria-label="Note editor"><form method="dialog" class="editor-shell"><input hidden id="note-title" aria-label="Note title" placeholder="Untitled note" maxlength="200"><div id="note-body" role="textbox" aria-label="Note content" aria-multiline="true" contenteditable="true" data-placeholder="Write a note…" spellcheck="true"></div></form></dialog></div></div>
<footer class="app-bottom-bar"><div id="note-footer-controls"><span id="word-count">0 words</span><button id="pin-note" type="button" aria-label="Pin note" title="Pin note"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 3 8 0-1 6 3 4v2H6v-2l3-4-1-6Zm4 12v6"/></svg></button><button id="trash-note" type="button" aria-label="Move to trash" title="Move to trash"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button></div><div class="app-actions"><button id="theme" aria-label="Dark mode" title="Dark mode"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="moon-icon" d="M20 14a8 8 0 0 1-10-10A8.5 8.5 0 1 0 20 14Z"/><g class="sun-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g></svg></button><details class="more-menu"><summary aria-label="More options" title="More"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div><button id="open-text">Open text file…</button><button id="export">Export backup…</button><button id="import">Import backup…</button></div></details></div></footer>
<div id="toast" role="status" hidden></div>
<script src="image-support.js?v=0.22.0"></script><script src="rich-text.js?v=0.22.0"></script><script src="store.js?v=0.22.0"></script><script src="gantt-model.js?v=0.22.0"></script><script src="todo-model.js?v=0.22.0"></script><script src="folders-model.js?v=0.22.0"></script><script src="text-tools.js?v=0.22.0"></script><script src="app.js?v=0.22.0"></script><script src="editor-tools.js?v=0.22.0"></script><script src="tabs.js?v=0.22.0"></script><script src="folders-ui.js?v=0.22.0"></script><script src="rename-notes.js?v=0.22.0"></script><script src="drag-drop.js?v=0.22.0"></script><script src="line-numbers.js?v=0.22.0"></script><script src="indentation.js?v=0.22.0"></script><script src="tab-dots.js?v=0.22.0"></script><script src="images.js?v=0.22.0"></script><script src="image-resize.js?v=0.22.0"></script>
<script src="photo-store.js?v=0.22.0"></script><script src="galleries.js?v=0.22.0"></script>
<script src="gantt-ui.js?v=0.22.0"></script>
<script src="todo-ui.js?v=0.22.0"></script>
<script src="page-actions.js?v=0.22.0"></script><script src="app-updates.js?v=0.22.0"></script>
</body></html>
